openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /deck-exports:
    get:
      operationId: listDeckExports
      summary: List versioned PDF outputs in doc/decks
      responses:
        "200":
          description: Saved outputs, newest version first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckExport"
    post:
      operationId: saveDeckExport
      summary: Save PDF using the highest existing version plus one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckExportInput"
      responses:
        "201":
          description: Version saved without overwriting any earlier output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckExport"
  /deck-exports/{filename}:
    get:
      operationId: downloadDeckExport
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF output
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /brand-sources/inspect:
    post:
      operationId: inspectBrandSource
      summary: Read public Rayana brand website context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandSourceInput"
      responses:
        "200":
          description: Source status and extracted summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandSourceResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DeckExport:
      type: object
      required: [filename, version, path, downloadUrl, createdAt, bytes]
      properties:
        filename: { type: string }
        version: { type: integer }
        path: { type: string }
        downloadUrl: { type: string }
        createdAt: { type: string }
        bytes: { type: integer }
    DeckExportInput:
      type: object
      required: [pdfBase64]
      properties:
        pdfBase64:
          type: string
          minLength: 8
          maxLength: 45000000
    BrandSourceInput:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000 }
    BrandSourceResult:
      type: object
      required: [url, status, title, summary]
      properties:
        url: { type: string }
        status: { type: integer }
        title: { type: string }
        summary: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

